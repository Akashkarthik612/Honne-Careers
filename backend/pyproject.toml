[project]
name = "honne-careers-backend"
version = "0.1.0"
description = "Honne Careers P1 backend: truthful JD-tailored CVs"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.146.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "psycopg[binary,pool]==3.3.6",
    "psycopg-pool==3.3.3",
    "pyjwt[crypto]==2.15.1",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "google-genai==2.31.0",
    "langsmith==0.14.11",
    "langgraph==1.2.16",                     # chat agent loop (TurnGraph)
    "langgraph-checkpoint-postgres==3.2.0",  # its run state (AgentStateStore); see migration 20261024000001
    "jinja2==3.1.6",
    "pypdf==6.21.1",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "pip-audit",
    "bandit==1.9.4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "db: needs a real Postgres (DATABASE_URL_TEST); skipped locally when unset",
    "latex: needs the tectonic binary; skipped when it is not on PATH",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "SIM"]
# S101: asserts are fine in tests.
per-file-ignores = { "tests/**" = ["S101", "S105", "S106"], "app/render/latex.py" = ["E501"] }

[tool.bandit]
exclude_dirs = ["tests"]
