name: backend

on:
  pull_request:
    paths: ["backend/**", "supabase/**", "contracts/**", ".github/workflows/backend.yml"]
  push:
    branches: [test, main]
    paths: ["backend/**", "supabase/**", "contracts/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # RLS tests run here: no real Supabase or Gemini anywhere in CI (A4 #10).
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests docker
      - name: Tests (unit, golden, contract, RLS, API)
        run: pytest -q

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Dependency vulnerabilities
        run: pip-audit --skip-editable
      - name: Static security scan
        run: bandit -q -r app -c pyproject.toml

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image (bakes the Tectonic cache)
        run: docker build -t honne-api .
      - name: Offline compile + peak memory (networking off)
        run: docker run --rm --network none --entrypoint python honne-api docker/smoke_compile.py
      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id honne-api -u)" != "0"
